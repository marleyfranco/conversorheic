name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Definir versão
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSAO=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSAO=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Gerar executável e instalador
        shell: cmd
        run: build_windows.bat %VERSAO%

      - name: Testar se o executável abre
        shell: pwsh
        run: |
          $p = Start-Process dist\ConversorHEIC\ConversorHEIC.exe -ArgumentList "--autoteste" -PassThru
          $null = $p.Handle  # garante que o código de saída fique disponível
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id; throw "O autoteste travou." }
          if ($p.ExitCode -ne 0) {
            if (Test-Path autoteste.log) { Get-Content autoteste.log }
            throw "O autoteste falhou (código $($p.ExitCode))."
          }
          Write-Host "Autoteste OK"

      - name: Compactar versão portátil
        shell: pwsh
        run: Compress-Archive -Path dist\ConversorHEIC\* -DestinationPath "dist\ConversorHEIC-Portatil-$env:VERSAO.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ConversorHEIC-${{ env.VERSAO }}
          path: |
            dist/ConversorHEIC-Setup-*.exe
            dist/ConversorHEIC-Portatil-*.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ConversorHEIC-Setup-*.exe
            dist/ConversorHEIC-Portatil-*.zip
